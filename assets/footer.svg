<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104" role="img" aria-label="Build. Break. Learn. Repeat." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .w{font:500 15px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:5px;fill:#4b5563;animation:lit 4s ease-in-out infinite}
  @keyframes lit{0%{fill:#4b5563}8%,24%{fill:#e5e7eb}33%,100%{fill:#4b5563}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs>
  <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
    <stop offset=".5" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1000" height="104" rx="14"/></clipPath>
</defs>
<rect width="1000" height="104" rx="14" fill="#0b0f17"/>
<g clip-path="url(#clip)">
  <rect x="60" y="33" width="880" height="2" rx="1" fill="#1f2937"/>
  <rect x="60" y="33" width="180" height="2" rx="1" fill="url(#sweep)">
    <animate attributeName="x" values="60;760;60" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"
             calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>
  <text x="250" y="72" text-anchor="middle" class="w" style="animation-delay:0s">BUILD</text><text x="417" y="72" text-anchor="middle" class="w" style="animation-delay:1s">BREAK</text><text x="583" y="72" text-anchor="middle" class="w" style="animation-delay:2s">LEARN</text><text x="750" y="72" text-anchor="middle" class="w" style="animation-delay:3s">REPEAT</text>
</g>
<rect x=".5" y=".5" width="999" height="103" rx="14" fill="none" stroke="#1f2937"/>
</svg>