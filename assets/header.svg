<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Amrith S S, Information Technology student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .label{font:500 13px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:3px;fill:#38bdf8;opacity:.9;animation:fade 1s ease-out both}
  .name{font:700 64px 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:1px;fill:#e5e7eb;animation:rise 1s cubic-bezier(.2,.7,.2,1) .15s both}
  .draw{stroke-dasharray:140;animation:draw 1s ease-out .6s both}
  .cyc{font:500 20px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#cbd5e1;animation:cycle 9s ease-in-out infinite both}
  .tag{font:400 15px 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#6b7280;animation:fade 1s ease-out 1s both}
  .dot{fill:#34d399}
  .ring{fill:none;stroke:#34d399;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
  .edge{stroke:#38bdf8;stroke-opacity:.32;stroke-width:1;stroke-dasharray:3 7;animation:flow 1.6s linear infinite}
  .node{fill:#0b0f17;stroke:#38bdf8;stroke-width:1.5;animation:pulse 3s ease-in-out infinite}
  @keyframes fade{from{opacity:0}to{opacity:.9}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
  @keyframes cycle{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-6px)}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-10}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
